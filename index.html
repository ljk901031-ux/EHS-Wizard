<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EHS 반품 선언서 작성기</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14171f;--mu:#667085;--bd:#d9dde5;--ac:#1b3fbf;--acx:#fff;--er:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101319;--card:#1a1f29;--tx:#eef0f5;--mu:#98a2b3;--bd:#2d3442;--ac:#7c9cff;--acx:#0b1020;--er:#ff8a80}}
:root[data-theme="dark"]{--bg:#101319;--card:#1a1f29;--tx:#eef0f5;--mu:#98a2b3;--bd:#2d3442;--ac:#7c9cff;--acx:#0b1020;--er:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:20px;margin:6px 0 2px}.sub{color:var(--mu);font-size:13px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
label b{color:var(--er)}
input[type=text],input[type=date],textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:84px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.q{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--bd)}
.q:first-of-type{border-top:0}
.q .t{flex:1;font-size:14px}.q .t small{display:block;color:var(--mu);font-size:12px}
.seg{display:flex;gap:6px}
.seg button{min-width:52px;padding:9px 0;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:600 14px inherit}
.seg button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:var(--acx);font:700 16px inherit;margin-top:10px}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.mini{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:6px 10px;font-size:13px}
#sig{width:100%;aspect-ratio:800/220;border:1px dashed var(--mu);border-radius:10px;background:#fff;touch-action:none;display:block}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.err{color:var(--er);font-size:13px;margin-top:8px;min-height:18px}
#out{width:100%;height:auto;border:1px solid var(--bd);border-radius:6px;display:block;background:#fff}
.hide{display:none}
.note{font-size:12px;color:var(--mu);margin-top:8px}
</style></head><body>
<div class="wrap">
<section id="p1">
<h1>EHS 반품 선언서 작성</h1>
<p class="sub">Agilent LSCA Returns Form · 1단계: 입력 → 2단계: 완성본 확인·저장</p>

<div class="card"><h2>제품 정보 <span style="color:var(--er)">*필수</span></h2>
<label>Model/Part No. <b>*</b></label><input type="text" id="model" autocomplete="off">
<label>Serial No. <b>*</b></label><input type="text" id="serial" autocomplete="off">
<label>Order Reference (if applicable, e.g. SR) <b>*</b></label><input type="text" id="order" autocomplete="off" placeholder="해당 없으면 N/A">
</div>

<div class="card"><div class="row"><h2>1. 잔류 오염 가능성 (YES/NO)</h2><button class="mini" id="allno" type="button">전체 NO</button></div>
<div id="qs"></div>
<label>Other hazards 내용 (기타가 YES일 때)</label><input type="text" id="other">
</div>

<div class="card"><h2>2. 잔류 오염 상세 (최대 3줄)</h2>
<textarea id="q2" placeholder="농도, MSDS, 오염 위치 등 (영문 권장)"></textarea><div class="note" id="n2"></div>
<h2 style="margin-top:14px">3. 제염 방법 (최대 2줄)</h2>
<textarea id="q3" placeholder="Decontamination method"></textarea><div class="note" id="n3"></div>
<div class="q" style="margin-top:10px"><div class="t">잔류물이 비위험(non-hazardous)입니다<small>If residue is non-hazardous → YES 동그라미</small></div>
<div class="seg"><button type="button" id="nh">YES</button></div></div>
</div>

<div class="card"><h2>4. 선언 및 서명</h2>
<div class="row"><label style="margin:0">Authorized Signature (직접 서명)</label><button class="mini" id="clr" type="button">지우기</button></div>
<canvas id="sig" width="800" height="220" style="margin-top:6px"></canvas>
<div class="grid">
<div><label>Name (print)</label><input type="text" id="name"></div>
<div><label>Date</label><input type="date" id="date"></div>
<div><label>Company Name</label><input type="text" id="company"></div>
<div><label>Title</label><input type="text" id="title"></div>
<div><label>City</label><input type="text" id="city"></div>
<div><label>County</label><input type="text" id="county"></div>
<div><label>Phone Number</label><input type="text" id="phone"></div>
<div><label>Post code</label><input type="text" id="post"></div>
</div>
<label>Country</label><input type="text" id="country">
</div>
<div class="err" id="err"></div>
<button class="btn" id="go" type="button">완성본 만들기 →</button>
</section>

<section id="p2" class="hide">
<h1>완성본 확인</h1>
<p class="sub">위치가 맞는지 확인하고 저장하세요.</p>
<canvas id="out" width="1206" height="1552"></canvas>
<button class="btn" id="dpng" type="button">이미지(PNG) 저장</button>
<button class="btn" id="dpdf" type="button">PDF 저장</button>
<div class="note" id="dnote"></div>
<button class="btn s" id="back" type="button">← 수정하러 돌아가기</button>
</section>
</div>

function grow(p){bb=bb?[Math.min(bb[0],p[0]),Math.min(bb[1],p[1]),Math.max(bb[2],p[0]),Math.max(bb[3],p[1])]:[p[0],p[1],p[0],p[1]]}

function circle(c,cx,cy,rx,ry){c.save();c.strokeStyle=INK;c.lineWidth=2.6;c.lineCap="round";for(let k=0;k<2;k++){c.beginPath();const a0=-1.9+k*.25,n=70,tot=6.28+.55+k*.15;for(let i=0;i<=n;i++){const t=a0+tot*i/n,w=1+.035*Math.sin(t*2+k)+.02*i/n*(k?1:-1);const x=cx+rx*w*Math.cos(t)+(k?1.5:0),y=cy+ry*w*Math.sin(t)-(k?1:0);i?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()}c.restore()}
function put(c,t,x,y,w,s=21){if(!t)return;c.fillStyle=INK;let z=s;c.font=z+"px Arial,sans-serif";while(c.measureText(t).width>w&&z>10){z--;c.font=z+"px Arial,sans-serif"}c.fillText(t,x,y)}
